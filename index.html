<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thidir Vivasayi Products</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f0fdf4;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* HEADER */
    header {
        background: linear-gradient(90deg, #166534, #22c55e);
        color: white;
        padding: 16px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    main {
        flex: 1;
    }

    h2 {
        text-align: center;
        margin: 18px 0;
        color: #14532d;
        font-size: 18px;
    }

    /* PRODUCT GALLERY */
    .gallery {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 16px;
    }

    .product {
        background: white;
        border-radius: 16px;
        padding: 12px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        text-align: center;
    }

    .product img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 14px;
    }

    .product-name {
        margin-top: 10px;
        font-size: 16px;
        font-weight: 600;
        color: #166534;
    }

    /* ORDER BUTTON */
    .btn-container {
        text-align: center;
        margin: 24px 0 32px;
    }

    .order-btn {
        display: inline-block;
        background: #16a34a;
        color: white;
        padding: 14px 34px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 30px;
        text-decoration: none;
        box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }

    .order-btn:hover {
        background: #15803d;
    }

    /* FOOTER */
    footer {
        background: #14532d;
        color: #d1fae5;
        text-align: center;
        padding: 12px;
        font-size: 14px;
    }

    /* TABLET */
    @media (min-width: 600px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
            max-width: 900px;
            margin: auto;
        }
    }

    /* DESKTOP */
    @media (min-width: 900px) {
        .gallery {
            grid-template-columns: repeat(3, 1fr);
        }
    }
</style>
</head>

<body>

<header>
    Thidir Vivasayi
</header>

<main>
    <h2>Our Natural Products</h2>

    <div class="gallery">

        <div class="product">
            <img src="https://raw.githubusercontent.com/thidirvivasayi/thidirvivasayi_products/main/images/coc.png" alt="Coconut Oil">
            <div class="product-name">Cold Pressed Coconut Oil</div>
        </div>

        <div class="product">
            <img src="https://raw.githubusercontent.com/thidirvivasayi/thidirvivasayi_products/main/images/gingelly-oil.jpg" alt="Gingelly Oil">
            <div class="product-name">Traditional Gingelly Oil</div>
        </div>

        <div class="product">
            <img src="https://raw.githubusercontent.com/thidirvivasayi/thidirvivasayi_products/main/images/ground2_450x.jpg" alt="Groundnut Oil">
            <div class="product-name">Natural Groundnut Oil</div>
        </div>

    </div>

    <div class="btn-container">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSe8olOexryHB54nJ_kXWvgXdG5erYS--rT5kKmnc-vjHS4W2w/viewform?usp=publish-editor"
           target="_blank"
           class="order-btn">
            🌿 Place Order
        </a>
    </div>
</main>

<footer>
    © 2025 Thidir Vivasayi | All Rights Reserved
</footer>

</body>
</html>
